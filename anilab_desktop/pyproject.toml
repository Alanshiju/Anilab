[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anilab-desktop"
version = "0.1.0"
description = "Desktop client for AniMelo (animelo-4.apk protocol)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0.0",
    "PySide6>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
